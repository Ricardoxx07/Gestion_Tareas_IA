name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: gestor_test
          POSTGRES_PASSWORD: gestor_test_password
          POSTGRES_DB: gestor_tareas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gestor_test -d gestor_tareas_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_USER: gestor_test
      POSTGRES_PASSWORD: gestor_test_password
      POSTGRES_DB: gestor_tareas_test
      DATABASE_URL: postgresql+psycopg://gestor_test:gestor_test_password@localhost:5432/gestor_tareas_test
      DATABASE_URL_DOCKER: postgresql+psycopg://gestor_test:gestor_test_password@postgres:5432/gestor_tareas_test
      TEST_DATABASE_URL: postgresql+psycopg://gestor_test:gestor_test_password@localhost:5432/gestor_tareas_test
      JWT_SECRET_KEY: ci-only-secret-key-not-for-production
      JWT_ALGORITHM: HS256
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: 30

    steps:
      - name: Obtener el código
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Instalar dependencias
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Aplicar migraciones
        run: alembic upgrade head

      - name: Comprobar sincronización de migraciones
        run: alembic check

      - name: Ejecutar pruebas
        run: python -m pytest -q
